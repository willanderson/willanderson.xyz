<div class="flex flex-col w-full">
    <!-- Project Thumbnail -->
    <a href="{{ project.url | relative_url }}" aria-label="View {{ project.title | escape }}"
        class="w-full rounded-2xl p-8 flex items-center justify-center relative overflow-hidden aspect-[3/2] {% if include.compact %}min-h-[220px] md:min-h-[260px]{% else %}min-h-[380px]{% endif %} {% unless project.hero_style == 'background' %} bg-black dark:bg-zinc-900 {% endunless %}">

        {% if project.hero_style == 'background' %}
        <div style="background-image: url('{{ project.hero | relative_url }}')"
            class="absolute inset-0 bg-cover bg-center rounded-1xl" aria-hidden="true"></div>
        {% else %}
        <img class="w-full h-full object-contain" src="{{ project.hero | relative_url }}"
            alt="" loading="lazy" decoding="async" />
        {% endif %}

    </a>
    <!-- Project Details -->
    {% if include.show_details %}
    <div class="mt-3 flex flex-col">
        <p class="text-lg leading-tight text-zinc-500 dark:text-zinc-400">
            {{ project.company }}
        </p>
        <a href="{{ project.url | relative_url }}">
            <p class="text-xl leading-tight">
                {{ project.preview }}
            </p>
        </a>
    </div>
    {% endif %}
</div>
